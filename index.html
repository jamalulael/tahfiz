<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f1f5f9;--card:#fff;--tx:#1e293b;--mut:#64748b;--pri:#1e3fa8;--bd:#e2e8f0;--ph:#94a3b8;--lt:#eff6ff;--dg:#b91c1c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--pri:#3b5bdb;--bd:#334155;--ph:#64748b;--lt:#1e2a4a;--dg:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--pri:#3b5bdb;--bd:#334155;--ph:#64748b;--lt:#1e2a4a;--dg:#f87171;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 'DM Sans',system-ui,sans-serif}
nav{display:flex;justify-content:center;gap:28px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--bd);overflow-x:auto}
nav button{border:0;border-bottom:2px solid transparent;background:none;color:var(--mut);padding:14px 4px;font:500 15px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--pri);border-color:var(--pri);font-weight:700}nav .out{color:var(--dg);font-size:13px}
main{max-width:1100px;margin:0 auto;padding:14px 12px 30px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bar input{padding:10px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;font-size:15px}
.mut{color:var(--mut);font-size:12px}.hari{color:var(--pri);font-size:15px}
.sc{overflow-x:auto;background:var(--card);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
table{width:100%;min-width:980px;border-collapse:collapse}
th{background:var(--pri);color:#fff;padding:10px 6px;font-size:12px;text-align:center}
td{padding:4px 4px;border-bottom:1px solid var(--bd);font-size:12px}td:first-child{text-align:center;width:34px}
.nm{font-weight:500;min-width:150px;padding-left:6px}.wrap{white-space:normal;min-width:160px}
td select,td input{width:100%;padding:8px 6px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit;font-size:12px}
td input::placeholder{color:var(--ph)}
.ic{background:var(--pri);color:#fff;border:0;border-radius:8px;width:32px;height:32px;cursor:pointer;display:grid;place-items:center}
.ic{transition:background .2s}.ic.y{background:#facc15;color:#1e293b}.ic.g{background:#16a34a;color:#fff}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:700 14px inherit;font-family:inherit;cursor:pointer;display:flex;gap:8px;align-items:center}
.btn.o{background:var(--card);color:var(--dg);border:1px solid var(--dg);opacity:.9}
.msg{padding:10px 12px;border-radius:8px;background:var(--card);color:var(--mut);margin:12px 0;font-size:13px}
.gate{max-width:640px;margin:40px auto;background:var(--card);border-radius:20px;padding:34px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.gate h2{margin:0 0 6px;font-size:24px}.gate p{margin:0 0 26px;color:var(--mut)}
.gate .g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.gate button.m{padding:18px;border-radius:12px;font:700 15px inherit;font-family:inherit;cursor:pointer;border:1px solid var(--pri);background:var(--lt);color:var(--tx)}
.gate button.m.p{background:var(--pri);color:#fff}
.gate input{width:100%;padding:12px;margin-top:6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:18px}
.kb{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:10px 18px;font:inherit;font-size:14px;cursor:pointer}
.tt{text-align:center;color:var(--mut);font-size:14px;line-height:1.5}.tt h1{margin:0 0 4px;font-size:28px;color:var(--tx);letter-spacing:.2px}
.lg{justify-self:end;display:flex;gap:10px;align-items:center;background:#fff;border-radius:10px;padding:5px 10px}.lg img{height:40px;width:auto;display:block}
@media (max-width:720px){.hd{grid-template-columns:1fr;justify-items:center}.hd>div:first-child{justify-self:start}.lg{justify-self:center}.tt h1{font-size:22px}}

function hdr(){return`<div class="hd"><div><button class="kb" onclick="keluar()">Kembali</button></div><div class="tt"><h1>LAPORAN HARIAN TAHFIZ</h1><div>KELAS X-D</div><div>MA PEMBANGUNAN UIN JAKARTA</div></div><div class="lg">${LOGOS.map(s=>`<img src="${s}" alt="">`).join("")}</div></div>`}
function render(){
 if(!db){$("#m").innerHTML='<div class="msg">Database belum tersedia. Buka halaman ini dengan akun yang punya akses.</div>';return}
 if(!mode){$("#m").innerHTML=gate();return}
 ensureSub();
 if(mode=="ortu"&&!anak&&santri.length)anak=santri[0].id;
 const pick=mode=="ortu"?`<div class="bar"><label>Santri:</label><select style="padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit" onchange="anak=this.value;render()">${santri.map(s=>`<option value="${s.id}" ${s.id==anak?"selected":""}>${esc(s.nama)}</option>`).join("")}</select></div>`:"";
 $("#m").innerHTML=hdr()+(tab=="backup"?"":remind())+pick+(santri.length?({input:inputView,harian:harianView,mingguan:mingguView,backup:backupView}[tab])():'<div class="msg">Data santri belum tersedia.'+(mode=="guru"?' <button class="btn" style="margin-top:10px" onclick="seed()">Isi daftar santri (15 nama)</button>':'')+'</div>')}
const dateBar=()=>`<div class="bar"><label>Tanggal:</label><input type="date" value="${tgl}" onchange="if(this.value){tgl=this.value;dirty=false;render()}"><span class="mut">Pilih tanggal</span><b class="hari">Hari: ${hari(tgl)}</b></div>`;
function inputView(){
 const rows=santri.map((s,i)=>{const d=data[s.id+"_"+tgl]||{};return`<tr data-s="${s.id}"><td>${i+1}</td><td class="nm">${esc(s.nama)}</td>
 <td style="width:62px"><select class="j">${so(JUZ,d.juz,"-")}</select></td><td style="width:72px"><select class="d">${so(DET,d.detail,"Pilih juz")}</select></td>
 <td><input class="a" placeholder="Nomor ayat" value="${esc(d.ayat)}"></td><td style="width:105px"><select class="sz">${so(ST,d.statusZ,"-")}</select></td>
 <td><input class="m" placeholder="Surah/Ayat" value="${esc(d.murojaah)}"></td><td style="width:105px"><select class="sm">${so(ST,d.statusM,"-")}</select></td>
 <td><input class="c" placeholder="Catatan" value="${esc(d.catatan)}"></td><td style="width:42px"><button class="ic${data[s.id+"_"+tgl]?" g":""}" title="Simpan" onclick="saveRow('${s.id}').then(()=>say('Tersimpan: '+nm('${s.id}')))">${ICON}</button></td></tr>`}).join("");
 return dateBar()+`<div class="sc"><table oninput="mark(event)" onchange="mark(event)"><tr><th>No</th><th style="text-align:left">Nama</th><th>Juz</th><th>Detail<br>Juz</th><th>Ayat (Akhir<br>Setoran)</th><th>Status</th><th>Muroja’ah</th><th>Status</th><th>Catatan</th><th></th></tr>${rows}</table></div>
 <div class="acts"><button class="btn" onclick="saveAll()">${ICON} Simpan Data</button><button class="btn o" onclick="kosong()">Kosongkan Data</button></div><div id="st" class="msg" style="display:none"></div>`}
function mark(e){dirty=true;const t=e.target.closest("tr[data-s]");if(t)t.querySelector(".ic").className="ic y"}
const nm=id=>(santri.find(s=>s.id==id)||{}).nama||"";
function say(t){const e=$("#st");if(e){e.style.display="block";e.textContent=t}}
async function saveRow(sid){const r=document.querySelector(`tr[data-s="${sid}"]`),v=k=>r.querySelector("."+k).value.trim();
 const d={santriId:sid,tanggal:tgl,juz:v("j"),detail:v("d"),ayat:v("a"),statusZ:v("sz"),murojaah:v("m"),statusM:v("sm"),catatan:v("c"),diubah:Date.now()};
 const id=sid+"_"+tgl,ref=db.collection("setoran").doc(id);
 const b=r.querySelector(".ic");try{if(!(d.juz||d.detail||d.ayat||d.statusZ||d.murojaah||d.statusM||d.catatan)){if(data[id])await ref.delete();b.className="ic"}else{await ref.set(d);b.className="ic g"}}catch(e){say("Gagal menyimpan: "+(e.message||e.code));throw e}}
async function saveAll(){let n=0;for(const s of santri){try{await saveRow(s.id);n++}catch(e){return}}dirty=false;say("Data "+n+" santri untuk "+hari(tgl)+", "+tgl+" tersimpan ✓")}
function kosong(){if(!confirm("Kosongkan semua isian pada tanggal ini? (Data baru terhapus dari database setelah klik Simpan Data)"))return;
 document.querySelectorAll("tbody tr[data-s] select").forEach(e=>e.value="");document.querySelectorAll("tbody tr[data-s] input").forEach(e=>e.value="");document.querySelectorAll("tbody tr[data-s]").forEach(r=>{if(data[r.dataset.s+"_"+tgl])r.querySelector(".ic").className="ic y"});dirty=true;say("Isian dikosongkan. Klik Simpan Data untuk menyimpan perubahan.")}
function harianView(){
 const rows=list().map((s,i)=>{const d=data[s.id+"_"+tgl]||{},c=x=>esc(x||"–");return`<tr><td>${i+1}</td><td class="nm">${esc(s.nama)}</td><td style="text-align:center">${c(d.juz)}</td><td style="text-align:center">${c(d.detail)}</td><td style="text-align:center">${c(d.ayat)}</td><td>${c(d.statusZ)}</td><td>${c(d.murojaah)}</td><td>${c(d.statusM)}</td><td class="wrap">${c(d.catatan)}</td></tr>`}).join("");
 return dateBar()+`<div class="sc"><table><tr><th>No</th><th style="text-align:left">Nama</th><th>Juz</th><th>Detail Juz</th><th>Ayat (Akhir Setoran)</th><th>Status</th><th>Muroja’ah</th><th>Status</th><th>Catatan</th></tr>${rows}</table></div>`}
function mingguView(){
 const b=new Date(pekan+"T00:00:00");b.setDate(b.getDate()-((b.getDay()+6)%7));
 const D=[...Array(6)].map((_,i)=>{const x=new Date(b);x.setDate(x.getDate()+i);return fmt(x)}),tg=t=>t.slice(8)+"/"+t.slice(5,7);
 const cell=d=>{if(!d)return"–";const a=[];if(d.juz||d.detail||d.ayat)a.push(`<b>${esc("Juz "+(d.juz||"-")+(d.detail?" · "+d.detail:"")+(d.ayat?" · ay "+d.ayat:""))}</b>`+(d.statusZ?` <span class="mut">(${esc(d.statusZ)})</span>`:""));if(d.murojaah)a.push(`<span class="mut">M: ${esc(d.murojaah)}${d.statusM?" ("+esc(d.statusM)+")":""}</span>`);return a.join("<br>")||"–"};
 const rows=list().map((s,i)=>{const cs=D.map(t=>data[s.id+"_"+t]);
 const cat=D.map((t,k)=>cs[k]&&cs[k].catatan?`<b>${HARI[k+1].slice(0,3)}</b>: ${esc(cs[k].catatan)}`:"").filter(Boolean).join("<br>")||"–";
 return`<tr><td>${i+1}</td><td class="nm">${esc(s.nama)}</td>${cs.map(c=>`<td class="wrap" style="min-width:110px">${cell(c)}</td>`).join("")}<td class="wrap" style="min-width:200px">${cat}</td></tr>`}).join("");
 return`<div class="bar"><label>Pekan berisi tanggal:</label><input type="date" value="${pekan}" onchange="if(this.value){pekan=this.value;render()}"><b class="hari">Senin ${tg(D[0])} – Sabtu ${tg(D[5])}</b></div><div class="sc"><table style="min-width:1150px"><tr><th>No</th><th style="text-align:left">Nama</th>${D.map((t,k)=>`<th>${HARI[k+1]}<br><span style="font-weight:400">${tg(t)}</span></th>`).join("")}<th>Catatan</th></tr>${rows}</table></div>`}
const LB="lastBackup";
const getLB=()=>{try{return localStorage.getItem(LB)||""}catch(e){return""}};
function remind(){if(mode!="guru")return"";const n=new Date();if(n.getDate()>7)return"";const first=fmt(new Date(n.getFullYear(),n.getMonth(),1));if(getLB()>=first)return"";
 return`<div class="msg" style="border:1px solid #facc15;color:var(--tx);background:var(--card)">🔔 <b>Pengingat awal bulan:</b> unduh backup data hafalan sekarang supaya data tetap aman. <button class="btn" style="display:inline-flex;margin:8px 0 0 8px;padding:8px 14px" onclick="backupXlsx()">Unduh Excel</button></div>`}
function backupView(){const l=getLB();return`<div class="sc" style="padding:20px"><h2 style="margin:0 0 8px">Backup data</h2><p style="margin:0 0 14px;color:var(--mut)">Unduh seluruh data setoran (semua tanggal) ke komputer ini. Simpan juga salinannya di Google Drive. Disarankan setiap tanggal 1.</p><p style="margin:0 0 14px"><b>Backup terakhir di perangkat ini:</b> ${l?hari(l)+", "+l:"belum pernah"}</p><div class="acts" style="margin-top:0"><button class="btn" onclick="backupXlsx()">Unduh Excel (.xlsx)</button><button class="btn o" style="color:var(--pri);border-color:var(--pri)" onclick="backupCsv()">Unduh CSV</button></div><p class="mut" style="margin-top:14px">Tanggal backup terakhir dicatat per browser. Pengingat muncul tanggal 1–7 setiap bulan sampai backup diunduh.</p></div>`}
async function ambilSemua(){const q=await db.collection("setoran").get(),S={};santri.forEach(s=>S[s.id]=s);
 const r=q.docs.map(d=>d.data()).sort((a,b)=>a.tanggal.localeCompare(b.tanggal)||((S[a.santriId]||{}).urut||0)-((S[b.santriId]||{}).urut||0));
 return[["Tanggal","Hari","Nama","Juz","Detail Juz","Ayat (Akhir Setoran)","Status Setoran","Muroja’ah","Status Muroja’ah","Catatan"],...r.map(x=>[x.tanggal,hari(x.tanggal),(S[x.santriId]||{}).nama||"(dihapus)",x.juz||"",x.detail||"",x.ayat||"",x.statusZ||"",x.murojaah||"",x.statusM||"",x.catatan||""])]}
function selesaiBackup(n){try{localStorage.setItem(LB,fmt(new Date()))}catch(e){}alert("Backup berhasil: "+n+" baris data diunduh. Simpan file itu di tempat aman.");render()}
async function backupXlsx(){try{const a=await ambilSemua(),wb=XLSX.utils.book_new(),ws=XLSX.utils.aoa_to_sheet(a);ws["!cols"]=[12,9,30,6,10,18,14,22,16,40].map(w=>({wch:w}));XLSX.utils.book_append_sheet(wb,ws,"Setoran");XLSX.writeFile(wb,"backup-tahfiz-"+fmt(new Date())+".xlsx");selesaiBackup(a.length-1)}catch(e){alert("Gagal mengunduh Excel. Coba tombol Unduh CSV. ("+(e.message||e.code)+")")}}
async function backupCsv(){try{const a=await ambilSemua(),c=a.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\r\n"),u=URL.createObjectURL(new Blob(["\ufeff"+c],{type:"text/csv;charset=utf-8"})),l=document.createElement("a");l.href=u;l.download="backup-tahfiz-"+fmt(new Date())+".csv";document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);selesaiBackup(a.length-1)}catch(e){alert("Gagal mengunduh CSV: "+(e.message||e.code))}}
let subKey="",unsubS=null;
function ensureSub(){let f,t;if(tab=="mingguan"){const b=new Date(pekan+"T00:00:00");b.setDate(b.getDate()-((b.getDay()+6)%7));const e=new Date(b);e.setDate(e.getDate()+5);f=fmt(b);t=fmt(e)}else{f=tgl.slice(0,7)+"-01";t=tgl.slice(0,7)+"-31"}
 const k=f+t;if(k==subKey)return;subKey=k;if(unsubS)unsubS();
 unsubS=db.collection("setoran").where("tanggal",">=",f).where("tanggal","<=",t).onSnapshot(s=>{data={};s.docs.forEach(d=>data[d.id]=d.data());if(tab=="input"&&dirty)return;const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName)&&$("#m").contains(a))return;render()},e=>console.error(e))}
async function seed(){if(!confirm("Isi 15 nama santri awal?"))return;const b=db.batch();NAMA.forEach((n,i)=>b.set(db.collection("santri").doc("s"+String(i+1).padStart(2,"0")),{nama:n,urut:i+1}));try{await b.commit()}catch(e){alert("Gagal: "+(e.message||e.code))}}
(()=>{nav();
 if(FIREBASE_CONFIG.apiKey.startsWith("ISI_")){$("#m").innerHTML='<div class="msg">Isi FIREBASE_CONFIG di index.html terlebih dahulu.</div>';return}
 firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();render();
 db.collection("santri").onSnapshot(s=>{santri=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.urut||0)-(b.urut||0));if(!(tab=="input"&&dirty))render()},e=>console.error(e))})();
</script></body></html>
